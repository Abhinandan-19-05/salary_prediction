<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Salary Predictor</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .container {
            background: white;
            border-radius: 16px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.15);
            padding: 40px 50px;
            max-width: 750px;
            width: 100%;
        }
        h1 {
            color: #2c3e50;
            text-align: center;
            font-weight: 600;
            margin-bottom: 8px;
            font-size: 2rem;
        }
        .subtitle {
            text-align: center;
            color: #7f8c8d;
            margin-bottom: 30px;
            font-size: 0.95rem;
            border-bottom: 2px solid #ecf0f1;
            padding-bottom: 15px;
        }
        .form-group {
            margin-bottom: 18px;
        }
        label {
            display: block;
            font-weight: 500;
            color: #34495e;
            margin-bottom: 5px;
            font-size: 0.9rem;
        }
        input, select {
            width: 100%;
            padding: 10px 14px;
            border: 2px solid #dfe6e9;
            border-radius: 8px;
            font-size: 1rem;
            transition: border-color 0.2s;
            background: #fafbfc;
        }
        input:focus, select:focus {
            border-color: #3498db;
            outline: none;
            box-shadow: 0 0 0 3px rgba(52,152,219,0.2);
        }
        .row {
            display: flex;
            gap: 20px;
        }
        .row .form-group {
            flex: 1;
        }
        .btn {
            background: #3498db;
            color: white;
            border: none;
            padding: 12px 24px;
            font-size: 1.1rem;
            font-weight: 600;
            border-radius: 8px;
            cursor: pointer;
            width: 100%;
            transition: background 0.2s;
            margin-top: 8px;
        }
        .btn:hover {
            background: #2980b9;
        }
        .btn:active {
            transform: scale(0.98);
        }
        .result {
            margin-top: 25px;
            padding: 20px;
            border-radius: 10px;
            text-align: center;
            font-size: 1.3rem;
            font-weight: 600;
            background: #f0f9ff;
            border: 2px solid #3498db;
            color: #2c3e50;
        }
        .result .salary {
            font-size: 2rem;
            color: #27ae60;
            font-weight: 700;
        }
        .error {
            background: #fee;
            border-color: #e74c3c;
            color: #c0392b;
        }
        .hint {
            color: #7f8c8d;
            font-size: 0.75rem;
            margin-top: 4px;
        }
        
        /* Custom multi-select dropdown styles */
        .multi-select-wrapper {
            position: relative;
            width: 100%;
        }
        .multi-select-wrapper select {
            display: none;
        }
        .multi-select-trigger {
            width: 100%;
            padding: 10px 14px;
            border: 2px solid #dfe6e9;
            border-radius: 8px;
            background: #fafbfc;
            cursor: pointer;
            display: flex;
            justify-content: space-between;
            align-items: center;
            min-height: 46px;
            transition: border-color 0.2s;
        }
        .multi-select-trigger:hover {
            border-color: #b0c4d9;
        }
        .multi-select-trigger.active {
            border-color: #3498db;
            box-shadow: 0 0 0 3px rgba(52,152,219,0.2);
        }
        .multi-select-trigger .selected-text {
            color: #2c3e50;
            font-size: 0.95rem;
            flex: 1;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }
        .multi-select-trigger .arrow {
            color: #7f8c8d;
            font-size: 1.2rem;
            margin-left: 10px;
            transition: transform 0.2s;
        }
        .multi-select-trigger.active .arrow {
            transform: rotate(180deg);
        }
        .multi-select-dropdown {
            display: none;
            position: absolute;
            top: 100%;
            left: 0;
            right: 0;
            background: white;
            border: 2px solid #3498db;
            border-top: none;
            border-radius: 0 0 8px 8px;
            max-height: 200px;
            overflow-y: auto;
            z-index: 1000;
            box-shadow: 0 8px 16px rgba(0,0,0,0.1);
            margin-top: -2px;
        }
        .multi-select-dropdown.open {
            display: block;
        }
        .multi-select-dropdown .option-item {
            padding: 8px 14px;
            display: flex;
            align-items: center;
            cursor: pointer;
            transition: background 0.15s;
        }
        .multi-select-dropdown .option-item:hover {
            background: #e8f4fd;
        }
        .multi-select-dropdown .option-item input[type="checkbox"] {
            width: 18px;
            height: 18px;
            margin-right: 10px;
            cursor: pointer;
            accent-color: #3498db;
            flex-shrink: 0;
        }
        .multi-select-dropdown .option-item label {
            cursor: pointer;
            margin: 0;
            font-weight: 400;
            color: #2c3e50;
            font-size: 0.95rem;
        }
        .selected-tags {
            margin-top: 8px;
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
        }
        .selected-tag {
            background: #e8f4fd;
            color: #2980b9;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: 500;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }
        .selected-tag .remove-tag {
            cursor: pointer;
            color: #7f8c8d;
            font-weight: 700;
            font-size: 0.9rem;
            margin-left: 2px;
        }
        .selected-tag .remove-tag:hover {
            color: #e74c3c;
        }
        
        @media (max-width: 600px) {
            .container { padding: 25px 20px; }
            .row { flex-direction: column; gap: 0; }
            h1 { font-size: 1.6rem; }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>💰 Salary Predictor</h1>
        <div class="subtitle">Enter your profile details to estimate annual salary (LPA)</div>

        <form method="POST" id="predictionForm">
            <!-- Row 1: Degree & College Tier -->
            <div class="row">
                <div class="form-group">
                    <label for="degree">Degree</label>
                    <select id="degree" name="degree" required>
                        <option value="B.Tech" {% if sample.degree == 'B.Tech' %}selected{% endif %}>B.Tech</option>
                        <option value="BCA" {% if sample.degree == 'BCA' %}selected{% endif %}>BCA</option>
                        <option value="MBA" {% if sample.degree == 'MBA' %}selected{% endif %}>MBA</option>
                        <option value="B.Sc IT" {% if sample.degree == 'B.Sc IT' %}selected{% endif %}>B.Sc IT</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="college_tier">College Tier</label>
                    <select id="college_tier" name="college_tier" required>
                        <option value="Tier 1" {% if sample.college_tier == 'Tier 1' %}selected{% endif %}>Tier 1</option>
                        <option value="Tier 2" {% if sample.college_tier == 'Tier 2' %}selected{% endif %}>Tier 2</option>
                        <option value="Tier 3" {% if sample.college_tier == 'Tier 3' %}selected{% endif %}>Tier 3</option>
                    </select>
                </div>
            </div>

            <!-- Skills: Custom multi-select dropdown -->
            <div class="form-group">
                <label>Skills (select all that apply)</label>
                <div class="multi-select-wrapper" id="skillsWrapper">
                    <div class="multi-select-trigger" onclick="toggleDropdown('skillsDropdown')">
                        <span class="selected-text" id="skillsSelectedText">Select skills...</span>
                        <span class="arrow">▼</span>
                    </div>
                    <div class="multi-select-dropdown" id="skillsDropdown">
                        <div class="option-item">
                            <input type="checkbox" id="skill_aws" value="AWS" onchange="updateSelection('skills')">
                            <label for="skill_aws">AWS</label>
                        </div>
                        <div class="option-item">
                            <input type="checkbox" id="skill_azure" value="Azure" onchange="updateSelection('skills')">
                            <label for="skill_azure">Azure</label>
                        </div>
                        <div class="option-item">
                            <input type="checkbox" id="skill_cpp" value="C++" onchange="updateSelection('skills')">
                            <label for="skill_cpp">C++</label>
                        </div>
                        <div class="option-item">
                            <input type="checkbox" id="skill_dl" value="Deep Learning" onchange="updateSelection('skills')">
                            <label for="skill_dl">Deep Learning</label>
                        </div>
                        <div class="option-item">
                            <input type="checkbox" id="skill_docker" value="Docker" onchange="updateSelection('skills')">
                            <label for="skill_docker">Docker</label>
                        </div>
                        <div class="option-item">
                            <input type="checkbox" id="skill_java" value="Java" onchange="updateSelection('skills')">
                            <label for="skill_java">Java</label>
                        </div>
                        <div class="option-item">
                            <input type="checkbox" id="skill_js" value="JavaScript" onchange="updateSelection('skills')">
                            <label for="skill_js">JavaScript</label>
                        </div>
                        <div class="option-item">
                            <input type="checkbox" id="skill_k8s" value="Kubernetes" onchange="updateSelection('skills')">
                            <label for="skill_k8s">Kubernetes</label>
                        </div>
                        <div class="option-item">
                            <input type="checkbox" id="skill_linux" value="Linux" onchange="updateSelection('skills')">
                            <label for="skill_linux">Linux</label>
                        </div>
                        <div class="option-item">
                            <input type="checkbox" id="skill_ml" value="Machine Learning" onchange="updateSelection('skills')">
                            <label for="skill_ml">Machine Learning</label>
                        </div>
                        <div class="option-item">
                            <input type="checkbox" id="skill_mongodb" value="MongoDB" onchange="updateSelection('skills')">
                            <label for="skill_mongodb">MongoDB</label>
                        </div>
                        <div class="option-item">
                            <input type="checkbox" id="skill_mysql" value="MySQL" onchange="updateSelection('skills')">
                            <label for="skill_mysql">MySQL</label>
                        </div>
                        <div class="option-item">
                            <input type="checkbox" id="skill_nlp" value="NLP" onchange="updateSelection('skills')">
                            <label for="skill_nlp">NLP</label>
                        </div>
                        <div class="option-item">
                            <input type="checkbox" id="skill_node" value="Node.js" onchange="updateSelection('skills')">
                            <label for="skill_node">Node.js</label>
                        </div>
                        <div class="option-item">
                            <input type="checkbox" id="skill_pg" value="PostgreSQL" onchange="updateSelection('skills')">
                            <label for="skill_pg">PostgreSQL</label>
                        </div>
                        <div class="option-item">
                            <input type="checkbox" id="skill_pbi" value="Power BI" onchange="updateSelection('skills')">
                            <label for="skill_pbi">Power BI</label>
                        </div>
                        <div class="option-item">
                            <input type="checkbox" id="skill_python" value="Python" onchange="updateSelection('skills')">
                            <label for="skill_python">Python</label>
                        </div>
                        <div class="option-item">
                            <input type="checkbox" id="skill_react" value="React" onchange="updateSelection('skills')">
                            <label for="skill_react">React</label>
                        </div>
                        <div class="option-item">
                            <input type="checkbox" id="skill_sql" value="SQL" onchange="updateSelection('skills')">
                            <label for="skill_sql">SQL</label>
                        </div>
                        <div class="option-item">
                            <input type="checkbox" id="skill_tableau" value="Tableau" onchange="updateSelection('skills')">
                            <label for="skill_tableau">Tableau</label>
                        </div>
                    </div>
                </div>
                <div class="selected-tags" id="skillsTags"></div>
            </div>

            <!-- Certifications: Custom multi-select dropdown -->
            <div class="form-group">
                <label>Certifications (select all that apply)</label>
                <div class="multi-select-wrapper" id="certsWrapper">
                    <div class="multi-select-trigger" onclick="toggleDropdown('certsDropdown')">
                        <span class="selected-text" id="certsSelectedText">Select certifications...</span>
                        <span class="arrow">▼</span>
                    </div>
                    <div class="multi-select-dropdown" id="certsDropdown">
                        <div class="option-item">
                            <input type="checkbox" id="cert_aws_sa" value="AWS Solutions Architect" onchange="updateSelection('certs')">
                            <label for="cert_aws_sa">AWS Solutions Architect</label>
                        </div>
                        <div class="option-item">
                            <input type="checkbox" id="cert_azure_sa" value="Azure Solutions Architect" onchange="updateSelection('certs')">
                            <label for="cert_azure_sa">Azure Solutions Architect</label>
                        </div>
                        <div class="option-item">
                            <input type="checkbox" id="cert_azure_admin" value="Azure Administrator" onchange="updateSelection('certs')">
                            <label for="cert_azure_admin">Azure Administrator</label>
                        </div>
                        <div class="option-item">
                            <input type="checkbox" id="cert_gcp" value="Google Cloud Professional" onchange="updateSelection('certs')">
                            <label for="cert_gcp">Google Cloud Professional</label>
                        </div>
                        <div class="option-item">
                            <input type="checkbox" id="cert_oracle" value="Oracle Java" onchange="updateSelection('certs')">
                            <label for="cert_oracle">Oracle Java</label>
                        </div>
                        <div class="option-item">
                            <input type="checkbox" id="cert_sf_admin" value="Salesforce Administrator" onchange="updateSelection('certs')">
                            <label for="cert_sf_admin">Salesforce Administrator</label>
                        </div>
                        <div class="option-item">
                            <input type="checkbox" id="cert_sf_dev" value="Salesforce Developer" onchange="updateSelection('certs')">
                            <label for="cert_sf_dev">Salesforce Developer</label>
                        </div>
                        <div class="option-item">
                            <input type="checkbox" id="cert_ccna" value="Cisco CCNA" onchange="updateSelection('certs')">
                            <label for="cert_ccna">Cisco CCNA</label>
                        </div>
                        <div class="option-item">
                            <input type="checkbox" id="cert_pmp" value="PMP" onchange="updateSelection('certs')">
                            <label for="cert_pmp">PMP</label>
                        </div>
                        <div class="option-item">
                            <input type="checkbox" id="cert_scrum" value="Scrum Master" onchange="updateSelection('certs')">
                            <label for="cert_scrum">Scrum Master</label>
                        </div>
                    </div>
                </div>
                <div class="selected-tags" id="certsTags"></div>
            </div>

            <!-- Row 2: Internship Quality & Location -->
            <div class="row">
                <div class="form-group">
                    <label for="internship_quality">Internship Quality</label>
                    <select id="internship_quality" name="internship_quality" required>
                        <option value="Good" {% if sample.internship_quality == 'Good' %}selected{% endif %}>Good</option>
                        <option value="Average" {% if sample.internship_quality == 'Average' %}selected{% endif %}>Average</option>
                        <option value="None" {% if sample.internship_quality == 'None' %}selected{% endif %}>None</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="location">Location</label>
                    <select id="location" name="location" required>
                        <option value="Bangalore" {% if sample.location == 'Bangalore' %}selected{% endif %}>Bangalore</option>
                        <option value="Pune" {% if sample.location == 'Pune' %}selected{% endif %}>Pune</option>
                        <option value="Delhi" {% if sample.location == 'Delhi' %}selected{% endif %}>Delhi</option>
                        <option value="Gurgaon" {% if sample.location == 'Gurgaon' %}selected{% endif %}>Gurgaon</option>
                        <option value="Hyderabad" {% if sample.location == 'Hyderabad' %}selected{% endif %}>Hyderabad</option>
                        <option value="Chennai" {% if sample.location == 'Chennai' %}selected{% endif %}>Chennai</option>
                        <option value="Mumbai" {% if sample.location == 'Mumbai' %}selected{% endif %}>Mumbai</option>
                    </select>
                </div>
            </div>

            <!-- Row 3: Experience & Projects -->
            <div class="row">
                <div class="form-group">
                    <label for="experience_years">Experience (Years)</label>
                    <input type="number" id="experience_years" name="experience_years" value="{{ sample.experience_years }}" step="0.5" min="0" required>
                </div>
                <div class="form-group">
                    <label for="projects">Projects Completed</label>
                    <input type="number" id="projects" name="projects" value="{{ sample.projects }}" min="0" required>
                </div>
            </div>

            <button type="submit" class="btn">Predict Salary</button>
        </form>

        {% if prediction is not none %}
        <div class="result">
            <div>Estimated Annual Salary</div>
            <div class="salary">₹ {{ prediction }} LPA</div>
        </div>
        {% endif %}

        {% if error %}
        <div class="result error">
            <div>⚠️ Error</div>
            <div style="font-size:1rem; font-weight:400;">{{ error }}</div>
        </div>
        {% endif %}
    </div>

    <script>
        // Toggle dropdown visibility
        function toggleDropdown(dropdownId) {
            const dropdown = document.getElementById(dropdownId);
            const trigger = dropdown.parentElement.querySelector('.multi-select-trigger');
            
            // Close other dropdowns
            document.querySelectorAll('.multi-select-dropdown').forEach(d => {
                if (d.id !== dropdownId) {
                    d.classList.remove('open');
                    d.parentElement.querySelector('.multi-select-trigger').classList.remove('active');
                }
            });
            
            dropdown.classList.toggle('open');
            trigger.classList.toggle('active');
        }

        // Close dropdowns when clicking outside
        document.addEventListener('click', function(event) {
            const wrappers = document.querySelectorAll('.multi-select-wrapper');
            wrappers.forEach(wrapper => {
                if (!wrapper.contains(event.target)) {
                    const dropdown = wrapper.querySelector('.multi-select-dropdown');
                    const trigger = wrapper.querySelector('.multi-select-trigger');
                    dropdown.classList.remove('open');
                    trigger.classList.remove('active');
                }
            });
        });

        // Update selected items display
        function updateSelection(type) {
            const wrapper = document.getElementById(type === 'skills' ? 'skillsWrapper' : 'certsWrapper');
            const checkboxes = wrapper.querySelectorAll('input[type="checkbox"]');
            const selectedText = document.getElementById(type === 'skills' ? 'skillsSelectedText' : 'certsSelectedText');
            const tagsContainer = document.getElementById(type === 'skills' ? 'skillsTags' : 'certsTags');
            
            const selected = [];
            checkboxes.forEach(cb => {
                if (cb.checked) {
                    selected.push(cb.value);
                }
            });
            
            // Update selected text
            if (selected.length === 0) {
                selectedText.textContent = type === 'skills' ? 'Select skills...' : 'Select certifications...';
            } else if (selected.length <= 2) {
                selectedText.textContent = selected.join(', ');
            } else {
                selectedText.textContent = selected.length + ' selected';
            }
            
            // Update tags
            tagsContainer.innerHTML = '';
            selected.forEach(value => {
                const tag = document.createElement('span');
                tag.className = 'selected-tag';
                tag.innerHTML = `${value} <span class="remove-tag" onclick="removeTag('${type}', '${value}')">×</span>`;
                tagsContainer.appendChild(tag);
            });
        }

        // Remove a tag
        function removeTag(type, value) {
            const wrapper = document.getElementById(type === 'skills' ? 'skillsWrapper' : 'certsWrapper');
            const checkbox = wrapper.querySelector(`input[value="${value}"]`);
            if (checkbox) {
                checkbox.checked = false;
                updateSelection(type);
            }
        }

        // Initialize with sample values
        document.addEventListener('DOMContentLoaded', function() {
            // Pre-select sample skills
            const sampleSkills = {{ sample.skills|tojson }};
            const sampleCerts = {{ sample.certifications|tojson }};
            
            if (sampleSkills) {
                const skillCheckboxes = document.querySelectorAll('#skillsWrapper input[type="checkbox"]');
                skillCheckboxes.forEach(cb => {
                    if (sampleSkills.includes(cb.value)) {
                        cb.checked = true;
                    }
                });
                updateSelection('skills');
            }
            
            if (sampleCerts) {
                const certCheckboxes = document.querySelectorAll('#certsWrapper input[type="checkbox"]');
                certCheckboxes.forEach(cb => {
                    if (sampleCerts.includes(cb.value)) {
                        cb.checked = true;
                    }
                });
                updateSelection('certs');
            }
        });
    </script>
</body>
</html>
